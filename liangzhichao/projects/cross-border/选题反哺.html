<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨境税盾 · 选题反哺（提问埋点）</title>
<style>
:root{
  --bg:#0b1020;--bg2:#111936;--card:#151d3d;--card2:#1a2450;
  --txt:#e8ecff;--dim:#9aa7d0;--line:#2a3566;
  --gold:#ffc24d;--gold2:#ff9d2e;--cyan:#37e0ff;--green:#4ade80;--blue:#6c8bff;--red:#ff5c7a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 20% -10%,#1b2a5e 0%,transparent 50%),var(--bg);color:var(--txt);
  font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;line-height:1.6;min-height:100vh}
.top{position:sticky;top:0;z-index:40;background:rgba(11,16,32,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:auto;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:19px;font-weight:800;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:11px;color:var(--dim);font-weight:400;-webkit-text-fill-color:var(--dim)}
.cfg{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.cfg input{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--txt);outline:none;font-size:13px}
.cfg input:focus{border-color:var(--cyan)}
.cfg button{background:linear-gradient(90deg,var(--gold2),var(--gold));color:#231407;border:none;padding:9px 18px;border-radius:9px;font-weight:700;cursor:pointer;font-size:13px}
.cfg .ghost{background:var(--card2);color:var(--cyan);border:1px solid var(--line)}
.wrap{max-width:1240px;margin:auto;padding:26px 22px 90px}
.err{display:none;background:rgba(255,92,122,.12);border:1px solid var(--red);border-radius:12px;padding:14px 16px;margin-bottom:18px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kpi{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:0;background:radial-gradient(200px 70px at 100% 0%,rgba(55,224,255,.14),transparent)}
.kpi .l{font-size:12px;color:var(--dim)}
.kpi .n{font-size:26px;font-weight:800;margin-top:4px}
.kpi.small .n{font-size:20px}
.kpi.warn{border-color:var(--gold2)}
.kpi.hot{border-color:var(--cyan)}
.kpi .sub{font-size:11px;color:var(--dim);margin-top:2px}
section{margin:34px 0}
.sec-head{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--line);padding-bottom:10px;margin-bottom:18px}
.sec-head h2{font-size:20px}
.sec-head .hint{font-size:12px;color:var(--dim);margin-left:auto}
/* topic bars */
.topiclist{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:20px 24px;display:grid;gap:14px}
.tbar .row{display:flex;align-items:center;gap:14px;margin:9px 0}
.tbar .lab{width:120px;font-size:13px;font-weight:700;color:var(--txt);white-space:nowrap}
.tbar .track{flex:1;height:26px;background:var(--bg2);border-radius:8px;overflow:hidden;position:relative}
.tbar .fill{height:100%;border-radius:8px;display:flex;align-items:center;padding-left:10px;font-size:12px;color:#062f4a;font-weight:800;min-width:38px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.tbar .val{width:96px;font-size:12px;color:var(--dim);white-space:nowrap;text-align:right}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters .fg{font-size:12px;color:var(--dim);margin-right:4px}
.chip{padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:12.5px;cursor:pointer}
.chip.active{background:linear-gradient(90deg,var(--gold2),var(--gold));color:#231407;border-color:transparent;font-weight:700}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:920px}
th,td{text-align:left;padding:12px 14px;font-size:13px;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--card2);color:var(--gold);font-size:12px}
tr:last-child td{border-bottom:none}
tr.gap-row:hover{background:rgba(55,224,255,.05)}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700;background:var(--card2);color:var(--cyan);border:1px solid var(--line)}
.badge.hotc{color:#062f4a;background:var(--cyan);border:none}
.badge.hi{color:#231407;background:var(--gold);border:none}
.q{font-weight:600;color:var(--txt)}
.num{color:var(--gold);font-weight:700}
.mono{font:600 12px Consolas,monospace;color:var(--dim)}
.act{display:flex;gap:6px}
.act button{padding:6px 12px;border-radius:7px;border:none;font-size:12px;font-weight:700;cursor:pointer}
.cp{background:linear-gradient(90deg,var(--cyan),#2a8cff);color:#062f4a}
.cpw{background:var(--card);color:var(--gold);border:1px solid var(--gold2)!important}
.empty{color:var(--dim);text-align:center;padding:40px 0;font-size:14px}
.note{background:rgba(55,224,255,.07);border:1px solid rgba(55,224,255,.3);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--cyan);margin-top:16px}
.note b{color:var(--txt)}
footer{border-top:1px solid var(--line);margin-top:20px;padding:22px;text-align:center;color:var(--dim);font-size:12px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.loading{color:var(--dim);text-align:center;padding:50px 0}
.loading b{color:var(--cyan);animation:pulse 1.2s infinite}
@media(max-width:680px){.cfg{width:100%;margin-left:0}.cfg input{flex:1}.tbar .lab{width:88px}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">跨境税盾 · 选题反哺<small>提问埋点 → 内容缺口 → 选题优先级</small></div>
    <div class="cfg">
      <input type="text" id="cfgUrl" placeholder="后端地址 https://ai.kuajingshuidun.cn">
      <button type="button" onclick="loadData()">刷新</button>
      <button type="button" class="ghost" onclick="exportMd()">导出选题清单(MD)</button>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="err" id="errBox"></div>

  <div class="kpis" id="kpis"></div>

  <section id="topicSec" style="display:none">
    <div class="sec-head"><h2>最缺内容的专题 / 极点</h2><span class="hint">gap 次数越高的极点越该优先补文章 / 补知识库</span></div>
    <div class="topiclist" id="topiclist"></div>
  </section>

  <section id="gapSec" style="display:none">
    <div class="sec-head"><h2>内容缺口明细</h2><span class="hint">点击操作可导出「写文章 / 补知识库」选题</span></div>
    <div class="filters" id="mcFilters"></div>
    <div class="tblwrap">
      <table>
        <thead><tr><th>操作</th><th>用户问题（缺口）</th><th>专题</th><th>次数</th><th>最近提问</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <div class="note">
    <b>说明：</b>本页数据来自 A 端财税 AI 问答埋点（<span class="mono">/api/gaps</span>）——用户问到但知识库<b>未命中 / 置信度过低</b>的问题。
    次数低的应先当噪音滤掉，只看有量级的；点「复制」可把缺口一键转成 <span class="mono">写文章/补知识库</span> 选题清单，落地到 <span class="mono">选题清单-来自AI问答.md</span>。
  </div>

</div>

<footer>
  跨境税盾 · 提问埋点反哺选题后台 · 只读展示，不写回业务库 · 仅供运营与内容团队使用
</footer>

<script>
var base='';
try{ base=localStorage.getItem('tf_backend')||'https://ai.kuajingshuidun.cn'; }catch(e){}
document.getElementById('cfgUrl').value=base;
var state={ data:null, minCount:1, topic:'all' };
var PALETTE=['#37e0ff','#ffc24d','#4ade80','#8f6cff','#6c8bff','#ff9d2e','#4ade80','#5ac8fa'];

function saveCfg(){
  base=(document.getElementById('cfgUrl').value||'https://ai.kuajingshuidun.cn').replace(/\/+$/,'');
  try{ localStorage.setItem('tf_backend',base); }catch(e){}
}
function showErr(msg){ var e=document.getElementById('errBox'); e.style.display='block'; e.textContent='⚠ '+msg; }
function hideErr(){ document.getElementById('errBox').style.display='none'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function loadData(){
  saveCfg(); hideErr();
  document.getElementById('kpis').innerHTML='';
  document.getElementById('topiclist').innerHTML='';
  document.getElementById('tbody').innerHTML='<tr><td colspan="5" class="loading"><b>读取中…</b></td></tr>';
  var url=base+'/api/gaps?n=200&min_count='+state.minCount;
  fetch(url,{headers:{'Accept':'application/json'}})
    .then(function(r){
      if(!r.ok){ throw new Error('HTTP '+r.status+(r.status===403?'（已被后端拒绝，请检查地址）':'')); }
      return r.json();
    })
    .then(function(d){
      state.data=d;
      state.topic='all';
      // 过滤无中文的库噪声（爬虫/探测常见 `????`），避免运营页被垃圾问题刷屏
      var all=(d.gaps||[]).slice();
      state.noise=all.filter(function(g){ return ![...g.question].some(c=>/[一-鿿]/.test(c)); }).length;
      state.cleanGaps=all.filter(function(g){ return [...g.question].some(c=>/[一-鿿]/.test(c)); });
      d.gaps=state.cleanGaps; d.total=state.cleanGaps.length;
      // 专题聚合同样只基于有效缺口重算，避免把无中文噪声记进候选选题量
      var tm={};
      state.cleanGaps.forEach(function(g){ tm[g.topic]=tm[g.topic]||{gap_count:0,questions:0}; tm[g.topic].gap_count+=g.count||1; tm[g.topic].questions+=1; });
      d.by_topic=Object.keys(tm).map(function(t){ return {topic:t,gap_count:tm[t].gap_count,questions:tm[t].questions}; })
        .sort(function(a,b){ return b.gap_count-a.gap_count; });
      document.getElementById('topicSec').style.display='block';
      document.getElementById('gapSec').style.display='block';
      renderKpis(); renderTopics(); renderMcFilters(); renderTable();
    })
    .catch(function(e){ showErr('连接失败：'+e.message+'\n请确认后端地址（生产 https://ai.kuajingshuidun.cn，本地 http://localhost:8000）且已启动。'); });
}

function kpi(label,val,sub,extra){ return '<div class="kpi '+extra+'"><div class="l">'+label+'</div><div class="n">'+val+'</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'; }

function renderKpis(){
  var d=state.data, gaps=d.gaps||[];
  var topTopic=(d.by_topic&&d.by_topic[0])||null;
  var hot= gaps[0]||null;
  var hotQ= hot? esc(hot.question) :'—';
  document.getElementById('kpis').innerHTML=
    kpi('缺口总数', d.total, '中文有效缺口', 'hot')+
    kpi('专题数', (d.by_topic||[]).length, '涉及极点')+
    kpi('当前过滤缺口', gaps.length, (state.noise?('已滤 '+state.noise+' 条无中文噪声'):'展示条数'), (gaps.length? '' : 'warn'))+
    kpi('最缺内容极点', topTopic?esc(topTopic.topic):'—', topTopic?(topTopic.gap_count+' 次提问'):'暂无数据', 'warn');
  document.getElementById('kpis').innerHTML+=
    '<div class="kpi small"><div class="l">最高频缺口</div><div class="n" style="font-size:15px;font-weight:600;color:var(--cyan)">'+hotQ+'</div>'+(hot?('<div class="sub">'+hot.count+' 次</div>'):'')+'</div>';
}

var TOPIC_COLORS={};
function colorOf(t){
  if(!TOPIC_COLORS[t]) TOPIC_COLORS[t]=PALETTE[Object.keys(TOPIC_COLORS).length%PALETTE.length];
  return TOPIC_COLORS[t];
}
function renderTopics(){
  var rows=state.data.by_topic||[];
  if(!rows.length){ document.getElementById('topiclist').innerHTML='<div class="empty">暂无内容缺口，恭喜知识库覆盖良好</div>'; return; }
  var max=Math.max.apply(null,rows.map(function(r){return r.gap_count;}));
  document.getElementById('topiclist').innerHTML='<div class="tbar">'+rows.map(function(t){
    var w=Math.max(8,Math.round(t.gap_count/max*100));
    return '<div class="row"><div class="lab">'+esc(t.topic)+'</div>'+
      '<div class="track"><div class="fill" style="width:'+w+'%;background:linear-gradient(90deg,'+colorOf(t.topic)+','+colorOf(t.topic)+'88)">'+t.gap_count+'</div></div>'+
      '<div class="val">'+t.questions+' 个问题</div></div>';
  }).join('')+'</div>';
  // 点击专题行高亮跳转到明细过滤
}

function renderMcFilters(){
  var mc=[1,2,3,5];
  var html='<span class="fg">最少提问次数：</span>'+mc.map(function(m){
    return '<span class="chip'+(state.minCount===m?' active':'')+'" onclick="setMin(\''+m+'\')">≥'+m+' 次</span>';
  }).join('');
  html+='<span class="fg" style="margin-left:16px">专题：</span>';
  html+='<span class="chip'+(state.topic==='all'?' active':'')+'" onclick="setTopic(\'all\')">全部</span>';
  var ts=(state.data.by_topic||[]).map(function(t){return t.topic;});
  ts.forEach(function(t){
    html+='<span class="chip'+(state.topic===t?' active':'')+'" onclick="setTopic(\''+esc(t)+'\')">'+esc(t)+'</span>';
  });
  document.getElementById('mcFilters').innerHTML=html;
}
function setMin(m){ state.minCount=m; loadData(); }
function setTopic(t){ state.topic=t; renderTable(); }

function renderTable(){
  var rows=(state.data.gaps||[]);
  if(state.topic!=='all'){ rows=rows.filter(function(g){return g.topic===state.topic;}); }
  var html=rows.map(function(g){
    var badge=g.count>=5?'<span class="badge hi">高频</span>':(g.count>=2?'<span class="badge hotc">>1次</span>':'<span class="badge">'+g.count+'次</span>');
    return '<tr class="gap-row">'+
      '<td><div class="act"><button class="cp" onclick="copyTopic(\''+esc(g.question).replace(/[\\'\"]/g,'')+'\','+g.count+')">复制选题</button></div></td>'+
      '<td class="q">'+esc(g.question)+'</td>'+
      '<td>'+esc(g.topic)+'</td>'+
      '<td class="num">'+g.count+'</td>'+
      '<td class="mono">'+esc(g.last_asked||'')+'</td></tr>';
  }).join('');
  document.getElementById('tbody').innerHTML= html || '<tr><td colspan="5" class="empty">当前过滤下暂无缺口</td></tr>';
}

function copyTopic(q,c){
  var line='写文章/补知识库 | '+q+' | '+c+' 次';
  var ok=false;
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(line).then(function(){ok=true;toast('已复制选题：'+line);}).catch(function(){}); }
  if(!ok){ // 降级
    var ta=document.createElement('textarea'); ta.value=line; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('已复制选题：'+line); }catch(e){ alert(line); }
    document.body.removeChild(ta);
  }
}

function exportMd(){
  if(!state.data){ alert('请先刷新加载数据'); return; }
  var d=state.data, L=[];
  L.push('# 跨境税盾 · 选题清单（提问埋点反哺）');
  L.push('');
  L.push('> 数据来源：A 端财税AI问答埋点 `/api/gaps`（提问≥'+d.min_count+'次）。');
  L.push('> 生成时间：`'+new Date().toLocaleString('zh-CN')+'` ｜ 用途：指导 B 端跨境内容生产与知识库补录。');
  L.push('');
  L.push('## 一、最缺内容的专题 / 极点（优先补）');
  L.push('');
  L.push('| 专题 | 缺口提问次数 | 涉及问题数 |');
  L.push('|---|---|---|');
  (d.by_topic||[]).forEach(function(t){ L.push('| '+t.topic+' | '+t.gap_count+' | '+t.questions+' |'); });
  L.push('');
  L.push('## 二、内容缺口明细（用户真实在问）');
  L.push('');
  L.push('| 动作 | 用户问题 | 次数 | 专题 | 最近提问 |');
  L.push('|---|---|---|---|---|');
  (d.gaps||[]).forEach(function(g){ L.push('| 写文章/补知识库 | '+g.question.replace(/\|/g,'\\|')+' | '+g.count+' | '+g.topic+' | '+g.last_asked+' |'); });
  copyText(L.join('\n'));
}

function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){toast('已导出到剪贴板，粘到 MD 文件中即可');}).catch(function(){ fallbackCopy(t); }); }
  else { fallbackCopy(t); }
}
function fallbackCopy(t){ var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('已导出到剪贴板'); }catch(e){ }; document.body.removeChild(ta); }
var toastTimer=null;
function toast(msg){
  var n=document.getElementById('toast');
  if(!n){ n=document.createElement('div'); n.id='toast'; n.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,var(--gold2),var(--gold));color:#231407;padding:11px 20px;border-radius:12px;font-weight:700;font-size:13px;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.4)'; document.body.appendChild(n); }
  n.textContent=msg; n.style.display='block';
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ n.style.display='none'; },2600);
}

// 初次自动加载
loadData();
</script>
<script>
/* ============ 站内链接自动附加预览 token ============ */
document.addEventListener('click',function(e){
  const a=e.target.closest('a');
  if(!a)return;
  const href=a.getAttribute('href')||'';
  if(href.indexOf('#')===0||/^(https?:|mailto:|tel:|javascript:)/i.test(href))return;
  const qs=window.location.search;
  if(!qs||a.search!=='')return;
  e.preventDefault();
  const url=a.href+qs;
  if(a.target==='_blank'){window.open(url,'_blank');}
  else{window.location.href=url;}
});
</script>
</body>
</html>
